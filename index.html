<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#e6d5f7">
<title>Stickers!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="grain"></div>
<main class="screen">
	<h1 class="wordmark">Stickers!</h1>
	<p id="status">checking who you are...</p>
	<div id="board" hidden>
		<div class="circle-wrap">
			<div id="circle" contenteditable="true" enterkeyhint="done"></div>
			<p class="hint">tap the circle, then send a sticker from your keyboard</p>
		</div>
		<div id="grid"></div>
	</div>
</main>
<div id="viewer" hidden>
	<div id="viewerCard">
		<img id="viewerImg" alt="sticker">
		<p>save as sticker?</p>
		<p class="sub">press and hold the image, save it to photos, then go to your photos app, press and hold the photo, and save as sticker!</p>
		<button id="viewerClose">close</button>
	</div>
</div>
<script src="app.js"></script>
</body>
</html>
